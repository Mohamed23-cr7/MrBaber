<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Role Management - Barbershop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #111;
      padding: 30px;
      border: 2px solid #d4af37;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #fff;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #d4af37;
      border-radius: 5px;
      background-color: #000;
      color: #fff;
    }

    .btn-gold {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.3s;
      width: 100%;
    }

    .btn-gold:hover {
      background-color: #b89c30;
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Role Management</h2>
  <form>
    <label for="user">Select User</label>
    <select id="user">
      <option value="alice">Alice</option>
      <option value="bob">Bob</option>
      <option value="john">John</option>
    </select>

    <label for="role">Assign Role</label>
    <select id="role">
      <option value="admin">Admin</option>
      <option value="staff">Staff</option>
      <option value="customer">Customer</option>
    </select>

    <button class="btn-gold" type="submit">Update Role</button>
  </form>
</div>

</body>
</html>
