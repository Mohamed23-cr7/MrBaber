<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Barbershop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #111;
      border: 2px solid #d4af37;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      text-align: center;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 40px;
      font-size: 2.5rem;
      font-weight: bold;
    }

    a {
      display: block;
      margin: 20px;
      padding: 12px;
      text-decoration: none;
      font-size: 1.2rem;
      color: #fff;
      background-color: #333;
      border-radius: 8px;
      border: 2px solid #d4af37;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a:hover {
      background-color: #d4af37;
      color: #000;
    }

    a:focus {
      outline: none;
    }

    @media (max-width: 768px) {
      .container {
        width: 90%;
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Admin Dashboard</h1>
  <a href="all_appintment.html">View All Appointments</a>
  <a href="role_management.html">Manage Roles</a>
  <a href="staff.html">Staff Management</a>
</div>

</body>
</html>
