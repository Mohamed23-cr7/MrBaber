<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Home - Barbershop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #111;
      border: 2px solid #d4af37;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    h1 {
      color: #d4af37;
      margin-bottom: 40px;
      font-size: 2.5rem;
    }

    a {
      display: block;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      margin-bottom: 20px;
      background-color: #333;
      border-radius: 8px;
      border: 2px solid #d4af37;
      transition: all 0.3s ease;
    }

    a:hover {
      background-color: #d4af37;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .container {
        width: 90%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome, Customer!</h1>
    <a href="Appointment.html">Book Appointment</a>
    <a href="Rev.html">View Barbers & Reviews</a>
    <a href="setting.html">Settings</a>
  </div>

</body>
</html>
