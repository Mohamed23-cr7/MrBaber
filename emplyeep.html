<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Profile - Barbershop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #111;
      border: 2px solid #d4af37;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #d4af37;
    }

    .profile-header {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 20px;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #d4af37;
      margin-right: 20px;
    }

    .profile-details {
      color: #fff;
    }

    .profile-details h3 {
      margin: 0;
      color: #d4af37;
    }

    .profile-details p {
      margin: 8px 0;
      font-size: 16px;
      color: #ccc;
    }

    .profile-details .role {
      font-weight: bold;
      color: #d4af37;
    }

    .btn-edit {
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 20px;
      text-align: center;
      display: block;
      width: 100%;
    }

    .btn-edit:hover {
      background-color: #c29d29;
    }

    @media (max-width: 768px) {
      .profile-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .profile-photo {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Employee Profile</h2>
    
    <!-- Profile Header -->
    <div class="profile-header">
      <img src="john.jpg" alt="John's Photo" class="profile-photo">
      <div class="profile-details">
        <h3>John Doe</h3>
        <p class="role">Role: Barber</p>
        <p>Email: john@example.com</p>
        <p>Specialty: Classic Fades & Beard Styling</p>
        <p>Experience: 6 years</p>
        <p>Rating: ⭐⭐⭐⭐⭐ (32 Reviews)</p>
      </div>
    </div>

    <!-- Edit Profile Button -->
    <a href="edit-profile.html" class="btn-edit">Edit Profile</a>
  </div>

</body>
</html>
